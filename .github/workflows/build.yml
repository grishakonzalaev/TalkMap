name: Build release APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      # На ubuntu-latest Android SDK уже предустановлен. Принимаем лицензии,
      # чтобы AGP не падал на установке build-tools/платформы.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMGR=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name sdkmanager -path "*/cmdline-tools/*" 2>/dev/null | head -n1)
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found; SDK contents:"
            ls -R "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" 2>/dev/null | head -50 || true
          else
            echo "Using sdkmanager: $SDKMGR"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          fi

      # Подпись подключается только для tag-сборок (релизов).
      # Для push/PR release-APK собирается без подписи (unsigned).
      - name: Configure release signing (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.TALKMAP_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TALKMAP_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TALKMAP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TALKMAP_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/talkmap-release.jks
          cat > keystore.properties <<EOF
          storeFile=app/talkmap-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Signing configured for tag build."

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: talkmap-app-release
          path: app/build/outputs/apk/release/app-release.apk

      # Релиз создаётся только при пуше тега вида v*.
      - name: Create GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true